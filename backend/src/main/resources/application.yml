server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:campus_exchange}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:campus}
    password: ${DB_PASSWORD:campus-local}
    hikari:
      maximum-pool-size: 10
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
  jackson:
    time-zone: Asia/Shanghai
app:
  uploads: ${UPLOAD_DIR:./uploads}
  demo-data: ${DEMO_DATA:true}
